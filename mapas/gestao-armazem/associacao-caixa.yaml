repescagem:
  feita_em: 2026-08-19
  alvos:
    - alvo: "CT-02: Localizar prestador com uma única fatura sem incidência"
      procurei:
        - "No ecrã /armazem/associacao-caixa, escolhi Área = Medicamentos e
          verifiquei os campos disponíveis antes de qualquer sessão: só existem
          'Área' e 'Código da Caixa' + botão 'Abrir caixa' (desativado até haver
          código). O passo de localizar prestador só aparece depois de abrir uma
          caixa por pistolagem, e essa ação grava estado na BD (bloqueia a
          área/caixa) — por instrução desta repescagem não posso submetê-la."
        - Procurei uma rota direta (query string / sub-rota) que mostrasse a
          sessão sem passar por 'Abrir caixa'; não existe nenhum link, botão sem
          rótulo ou item de menu de contexto que leve lá.
        - "Verifiquei se alguma das outras telas da secção Gestão de Armazém
          reproduz 'localizar prestador → auto-seleção de fatura única': em
          Registo de Entrada (/armazem/registo-entrada/detalhe) existe uma
          'Captura de facturas' por código de farmácia, mas é um formulário de
          criação de registos de entrada, não uma seleção de faturas já
          existentes por associar."
      onde:
        - http://localhost:4174/armazem/associacao-caixa
        - http://localhost:4174/armazem/registo-entrada
        - http://localhost:4174/armazem/registo-entrada/detalhe?ano=2026&mes=9&area=MEDICAMENTOS
      resultado: nao_existe
      accao: null
      nota: O campo de localização de prestador só existe dentro de uma sessão de
        caixa aberta; abrir a caixa é uma ação que altera estado (bloqueia a
        área), pelo que esta passagem, que não pode submeter nada, não consegue
        alcançá-lo nem confirmar nem refutar o comportamento de auto-seleção
        descrito em CT-02.
    - alvo: "CT-03: Localizar prestador com várias faturas (navegação com setas)"
      procurei:
        - "Mesma tentativa que em CT-02: sem abrir caixa não há campo de
          localização de prestador nem lista de faturas para navegar com setas."
        - Verifiquei em Registo de Entrada (/armazem/registo-entrada/detalhe) se
          a tabela de faturas capturadas tinha algum mecanismo de navegação por
          setas entre registos do mesmo prestador — a tabela é uma listagem
          paginada normal, sem navegação por setas nem seleção de fatura.
        - Procurei um ícone ou menu de três pontos junto ao campo 'Código da
          Caixa' no ecrã principal que desse acesso a uma pré-visualização de
          faturas por prestador sem abrir a caixa; não existe.
      onde:
        - http://localhost:4174/armazem/associacao-caixa
        - http://localhost:4174/armazem/registo-entrada/detalhe?ano=2026&mes=9&area=MEDICAMENTOS
      resultado: nao_existe
      accao: null
      nota: "Mesma dependência de CT-02: a navegação com setas entre faturas de um
        prestador só existe depois de abrir uma sessão de caixa, ação de estado
        que esta passagem não executa."
    - alvo: "CT-04: Fatura com incidência não é completável"
      procurei:
        - Sem sessão de caixa aberta, não há como tentar selecionar/completar
          uma fatura com incidência dentro de Associação à Caixa.
        - Fui a 'Faturas com Incidência' (/gestao-armazem/faturas-incidencia) e
          pesquisei a única incidência histórica em QUA (Nº Factura 24100806); a
          pesquisa exige pelo menos um filtro preenchido e devolveu 'Sem
          facturas com incidência para os filtros selecionados' (o filtro Área
          nem sequer lista Cuidados Continuados, que é a área desta fatura — só
          Medicamentos [pelo combo geral], MCDT, CRD, Cuidados Termais e Saúde
          Oral/SISO).
        - "Abri o botão 'Atribuir localização' desse ecrã (rota
          /gestao-armazem/faturas-incidencia/atribuir): é o formulário para dar
          uma localização física a faturas que ficaram sem local ao capturar — é
          a ação de SETUP referida pela primeira passagem, não a verificação de
          que a fatura fica 'destacada e não completável' dentro da sessão de
          caixa."
        - "Fui a Localizar / Corrigir (/arquivo), Tipo=Factura, código 24100806:
          mostra a fatura já associada a Pasta 2885006 / Caixa C20809 / Armazém
          de entrada, sem qualquer indicador visual de incidência nesse painel
          de correção."
        - "Verifiquei o filtro 'Estado' da listagem de Associação à Caixa
          (/armazem/associacao-caixa/listagem): só tem Todas / Concluída / Por
          fazer, sem opção de incidência."
      onde:
        - http://localhost:4174/armazem/associacao-caixa
        - http://localhost:4174/gestao-armazem/faturas-incidencia
        - http://localhost:4174/gestao-armazem/faturas-incidencia/atribuir
        - http://localhost:4174/arquivo
        - http://localhost:4174/armazem/associacao-caixa/listagem
      resultado: nao_existe
      accao: null
      nota: Não encontrei, em nenhuma tela acessível sem abrir uma sessão de caixa, o
        comportamento de 'fatura com incidência aparece destacada e não pode ser
        completada' descrito em CT-04. A única ação relacionada com incidência
        que existe fora da sessão (Atribuir localização) é a marcação/atribuição
        de local à fatura, não a validação de bloqueio dentro da Associação à
        Caixa.
    - alvo: "CT-05: Validações do código de localização"
      procurei:
        - Testei os únicos campos disponíveis antes de abrir caixa (Área, Código
          da Caixa) — não são o 'código de localização do prestador' que CT-05
          descreve; esse campo só surge dentro da sessão.
        - Procurei se o campo 'Código da Caixa' tem validação inline
          (vazio/inexistente) sem clicar em 'Abrir caixa' — não digitei nada
          nele fora do necessário para não arriscar submissão acidental, e mesmo
          que tivesse validação, não é o mesmo campo/cenário do documento (que
          fala em prestador, não em caixa).
        - "Procurei um padrão de validação equivalente (vazio / inexistente /
          área errada) noutras telas da secção: em Localizar / Corrigir
          (/arquivo) o campo 'Código' aceita qualquer tipo e devolve mensagens
          como 'Pasta não encontrado(a) com id: ...', mas é uma validação de
          outro campo/ação (localizar item de arquivo), não do código de
          localização de prestador dentro de uma caixa aberta."
      onde:
        - http://localhost:4174/armazem/associacao-caixa
        - http://localhost:4174/arquivo
      resultado: nao_existe
      accao: null
      nota: As três validações descritas (vazio, inexistente, área errada) aplicam-se
        ao campo de localização de prestador que só existe dentro de uma sessão
        de caixa aberta; sem abrir a caixa (ação que altera estado) não há como
        as observar.
    - alvo: "CT-06: Completar e registar na caixa com Enter"
      procurei:
        - Sem sessão de caixa aberta não existe pasta pistolada, campo Nº Lotes
          físicos nem tabela de 'registadas' para confirmar o Enter.
        - "Procurei um padrão de 'Enter para adicionar/registar' equivalente
          noutra tela da secção: em Registo de Entrada
          (/armazem/registo-entrada/detalhe) existe mesmo um botão 'Adicionar
          (Enter)' que grava uma linha (código da farmácia + Nº Fatura + Nº
          Lotes + Observação) e mantém o foco para o próximo registo — mas é a
          ação de capturar uma NOVA entrada de fatura no ciclo de registo de
          entrada, não de registar uma fatura já existente dentro de uma caixa."
        - Confirmei que este botão de Registo de Entrada não referencia pasta
          nem caixa (não tem esses campos), pelo que não substitui a ação de
          CT-06.
      onde:
        - http://localhost:4174/armazem/associacao-caixa
        - http://localhost:4174/armazem/registo-entrada/detalhe?ano=2026&mes=9&area=MEDICAMENTOS
      resultado: nao_existe
      accao: null
      nota: Existe um padrão de UI parecido ('Enter para gravar e passar ao seguinte')
        em Registo de Entrada, mas é uma ação diferente (captura de fatura no
        ciclo de entrada), sem pasta nem caixa envolvidas — não é o mesmo alvo.
        A ação de CT-06 propriamente dita só existe dentro da sessão de caixa
        aberta.
    - alvo: "CT-07: Divergência de lotes físicos"
      procurei:
        - Sem sessão de caixa aberta não há como registar uma fatura com Nº
          Lotes físicos diferente do declarado, no momento da associação.
        - Fui a Localizar / Corrigir (/arquivo), Tipo = Factura, procurei a
          fatura 24100806 (já associada a Pasta 2885006 / Caixa C20809).
          Apareceu um painel 'Corrigir factura 24100806' com 'De (atual)'
          (Pasta, Caixa, Localização, Nº de lotes = '—', Observações) e 'Para
          (destino)' com os campos Nº de lotes e Observações + botão 'Guardar
          correção'.
