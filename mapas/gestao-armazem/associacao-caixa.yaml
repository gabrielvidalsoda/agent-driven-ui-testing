documento: gestao-armazem/associacao-caixa.md
rota: /armazem/associacao-caixa
mapeado_em: 2026-08-19
mapeado_contra:
  ui: origin/develop 30446d5, build de 2026-08-16
  api: jar de feature/cockpit-disparar 25a869e, construido a 2026-08-12
notas_metodologicas: Esta passagem é de inventário (sem submissões que alterem
  estado). O botão 'Abrir caixa' está marcado no documento como '(altera estado
  no ambiente)' e não foi premido; por isso toda a UI que só existe DENTRO de
  uma sessão de caixa aberta (localizar prestador, navegação por setas, destaque
  de incidência, completar pasta/lotes/observação, registar com Enter, tabela de
  registadas, Encerrar caixa) não foi observável nesta passagem — não é uma
  afirmação de que a tela não a tenha, apenas que fica atrás de uma ação de
  escrita que esta passagem não pode acionar. Uma passagem de execução dedicada,
  com massa de teste própria, é necessária para mapear essa parte.
accoes:
  - id: abrir-caixa
    tipo: criacao
    nome: Abrir caixa por pistolagem
    como: "No ecrã /armazem/associacao-caixa, escolher a Área (combobox) e
      preencher/pistolar o Código da Caixa; o botão 'Abrir caixa' fica
      desativado até ambos os campos estarem preenchidos. Não foi premido
      (altera estado: abre sessão e bloqueia a área)."
    promessa: "Rótulo 'Abrir caixa' promete abrir uma caixa e iniciar uma sessão de
      associação, bloqueando a área da sessão até a caixa ser encerrada
      (conforme secção 1 do documento e comportamento do botão observado: só
      ativa com Área + Código preenchidos)."
    rota: /armazem/associacao-caixa
    entradas:
      - campo: Área
        obrigatorio: true
        origem_valores: "combobox fixo com 5 opções: Medicamentos, MCDT, CRD, Cuidados
          Termais, Saúde Oral (SISO)"
      - campo: Código da Caixa
        obrigatorio: true
        origem_valores: texto livre, placeholder 'Pistolar / introduzir…'
    casos_documento:
      - CT-01
  - id: ver-listagem
    tipo: navegacao
    nome: Ver listagem (do ecrã de execução)
    como: Clicar no botão 'Ver listagem' no cabeçalho do ecrã
      /armazem/associacao-caixa.
    promessa: "Rótulo 'Ver listagem' promete levar à página associada 'Associação à
      Caixa — Listagem'. Confirmado: navega para
      /armazem/associacao-caixa/listagem sem qualquer aviso de perda de dados
      (porque não havia sessão aberta)."
    rota: /armazem/associacao-caixa/listagem
  - id: ir-para-execucao
    tipo: navegacao
    nome: Ir para execução (da listagem)
    como: Na página de listagem, clicar no botão 'Ir para execução'.
    promessa: "Rótulo 'Ir para execução' promete voltar ao ecrã de sessão.
      Confirmado: navega para /armazem/associacao-caixa."
    rota: /armazem/associacao-caixa
  - id: pesquisar-listagem
    tipo: consulta
    nome: Pesquisar faturas associadas/por associar
    como: "Na listagem, clicar 'Pesquisar' sem escolher Área — surge alerta; depois
      escolher Área (ex.: Medicamentos) e voltar a clicar 'Pesquisar'."
    promessa: "Cabeçalho 'Resultados' promete devolver uma tabela paginada de
      faturas por área, com colunas IdFactura, Prestador, Factura, Data Receção,
      Caixa, Pasta, Nº Lotes, Lugar da Caixa, Estado da Caixa, Observações. A
      mensagem de validação exibida foi exatamente 'Selecione a área para
      pesquisar.' Testado com área Medicamentos: devolveu 46675 resultados
      paginados (10/página); coluna 'Estado da Caixa' mostrou valores reais como
      'Pendente de associação à caixa', 'No Armazém Temporário' e 'Expedido' —
      não literalmente 'Concluída'/'Por fazer' (esses são os rótulos do filtro
      Estado, não da coluna)."
    rota: /armazem/associacao-caixa/listagem
    entradas:
      - campo: Área
        obrigatorio: true
        origem_valores: "combobox fixo com 5 opções: Medicamentos, MCDT, CRD, Cuidados
          Termais, Saúde Oral (SISO)"
    casos_documento:
      - CT-09
  - id: filtrar-prestador
    tipo: filtro
    nome: Filtrar por Prestador (código)
    como: Com Área = Medicamentos, escrever '21180' no campo 'Prestador (código)' e
      clicar 'Pesquisar'.
    promessa: "Placeholder 'Ex.: 9423' promete filtrar a listagem por código de
      prestador. Confirmado: com '21180', a tabela devolveu só faturas desse
      prestador."
    rota: /armazem/associacao-caixa/listagem
    entradas:
      - campo: Prestador (código)
        obrigatorio: false
        origem_valores: texto livre numérico
  - id: filtrar-estado-associacao
    tipo: filtro
    nome: Filtrar por estado de associação
    como: Abrir o combobox 'Estado' na listagem.
    promessa: "Combobox 'Estado' promete 3 opções: Todas (default), Concluída, Por
      fazer — conforme CT-10. Opções confirmadas por abertura do combobox;
      comportamento de cada opção sobre a contagem de resultados não foi
      executado nesta passagem."
    rota: /armazem/associacao-caixa/listagem
    entradas:
      - campo: Estado
        obrigatorio: false
        origem_valores: "combobox fixo: Todas, Concluída, Por fazer"
    casos_documento:
      - CT-10
  - id: filtrar-pedido-pagamento
    tipo: filtro
    nome: Filtrar por Pedido Pag (PP) — só em SISO
    como: Selecionar Área = Saúde Oral (SISO); surge o campo extra 'Pedido Pag
      (PP)'. Pesquisado com o campo vazio para observar a grelha.
    promessa: "Rótulo 'Pedido Pag (PP)' promete filtrar faturas SISO por número de
      pedido de pagamento. Divergência face ao documento: CT-11 espera 'colunas
      extra Pedido Pag e Nº Cheques' na grelha ao usar a área SISO; nesta build
      a grelha manteve exatamente as mesmas 10 colunas (IdFactura…Observações)
      independentemente da área — só o filtro PP aparece, não colunas
      adicionais."
    rota: /armazem/associacao-caixa/listagem
    entradas:
      - campo: Pedido Pag (PP)
        obrigatorio: false
        origem_valores: texto livre, placeholder 'Nº do pedido'; campo só visível com
          Área = Saúde Oral (SISO)
    casos_documento:
      - CT-11
  - id: limpar-filtros-listagem
    tipo: edicao
    nome: Limpar filtros da listagem
    como: Com Área, Prestador e resultados preenchidos, clicar 'Limpar'.
    promessa: "Rótulo 'Limpar' promete repor o formulário. Confirmado: Área volta a
      'Selecione…', Prestador fica vazio, Estado volta a 'Todas' e a tabela de
      resultados desaparece."
  - id: exportar-xlsx-listagem
    tipo: exportacao
    nome: Exportar XLSX
    como: Com Área = Saúde Oral (SISO) pesquisada, clicar no botão/ícone 'Exportar
      XLSX'.
    promessa: "Tooltip/rótulo 'Exportar XLSX' promete descarregar os resultados
      atuais em ficheiro Excel. Confirmado: dispara POST para
      /ccmsns/api/armazem/associacoes-caixa/exportar?area=SISO, botão mostra
      progressbar e desativa-se durante o pedido, e o browser descarregou
      'associacao-caixa.xlsx'."
    rota: /armazem/associacao-caixa/listagem
  - id: paginar-resultados-listagem
    tipo: navegacao
    nome: Paginação dos resultados
    como: Observados os controlos de paginação
      (primeira/anterior/números/seguinte/última) e o seletor 'Resultados por
      página' (default 10) no rodapé da grelha.
    promessa: "Controlo de paginação promete navegar por milhares de páginas de
      resultados (ex.: 46675 resultados / 4668 páginas para Medicamentos); não
      foi acionado para não gerar tráfego desnecessário, apenas confirmada a
      presença e os valores."
    rota: /armazem/associacao-caixa/listagem
  - id: corrigir-factura-lotes-observacoes
    tipo: edicao
    nome: Corrigir factura — Nº de lotes / Observações
    como: Em 'Localizar / Corrigir' (rota /arquivo), escolher Tipo = Factura,
      introduzir o código/nº da fatura e clicar 'Localizar'. No painel 'Corrigir
      factura', preencher o campo 'Nº de lotes' (e opcionalmente 'Observações')
      em 'Para (destino)' e clicar 'Guardar correção'.
    promessa: Sobrepõe o nº de lotes físicos de uma fatura já associada a uma
      pasta/caixa, documentando uma divergência face ao valor anterior. Neste
      ecrã o botão de gravar fica ativo apenas com o Nº de lotes preenchido — a
      Observação não é tecnicamente obrigatória para gravar (não confirmei o
      comportamento do servidor por não ter submetido).
    rota: /arquivo
    entradas:
      - campo: Tipo
        obrigatorio: true
        origem_valores: "combobox: Factura / Pasta / Caixa"
      - campo: Código
        obrigatorio: true
        origem_valores: código/nº da fatura a corrigir
      - campo: Nº de lotes (destino)
        obrigatorio: false
        origem_valores: numérico
      - campo: Observações (destino)
        obrigatorio: false
        origem_valores: texto livre
    casos_documento:
      - CT-07
    equivalente_aproximado: true
    ressalva: Esta é uma correção a posteriori (sobre uma fatura já registada em
      pasta/caixa), feita noutra tela da secção — não é o passo de registo
      inicial dentro da sessão de Associação à Caixa que CT-07 descreve.
      Reporto-a como o mecanismo funcionalmente equivalente disponível na
      aplicação para tratar/documentar divergências de lotes, com a ressalva de
      que não é o mesmo momento do fluxo.
  - id: corrigir-caixa-estado-aguardando-preparacao
    tipo: edicao
    nome: Corrigir caixa — definir Localização (estado) = Aguardando preparação
    como: Em 'Localizar / Corrigir' (rota /arquivo), escolher Tipo = Caixa,
      introduzir o código da caixa e clicar 'Localizar'. No painel 'Corrigir
      caixa', escolher no combobox 'Localização (estado)' a opção 'Aguardando
      preparação' e clicar 'Guardar correção'.
    promessa: Força o estado da caixa diretamente para 'Aguardando preparação' — o
      mesmo estado final que CT-08 espera obter ao clicar 'Encerrar caixa'
      dentro da sessão — mas por correção manual direta, sem passar pelo fluxo
      de encerramento, sem validar se há 2+ faturas registadas e sem o modal de
      confirmação descritos em CT-08.
    rota: /arquivo
    entradas:
      - campo: Tipo
        obrigatorio: true
        origem_valores: "combobox: Factura / Pasta / Caixa"
      - campo: Código
        obrigatorio: true
        origem_valores: código da caixa
      - campo: Localização (estado) (destino)
        obrigatorio: true
        origem_valores: "combobox: Recepcionada / Aguardando preparação"
    casos_documento:
      - CT-08
    equivalente_aproximado: true
    ressalva: "Reporto isto como o efeito equivalente ao encerramento da caixa (rule
      4: consequência de outra ação), com a ressalva clara de que é uma correção
      manual de estado, não a ação 'Encerrar caixa' com validação de faturas e
      modal de confirmação testada em CT-08."
insumos_necessarios:
  - descricao: Caixa pistolável na área do teste, num estado que permita abrir
      sessão de associação
    obtivel: bd
    razao: "Existe massa real em GESTARMAZEM.TDCAIXA (read-only) e referências no
      documento (ex.: 102516, C24035); nesta tela e nas suas vizinhas de Gestão
      de Armazém não foi encontrada nenhuma ação de 'criar caixa' — o código de
      caixa é pistolado, presumindo-se originado por processo/impressora
      externos à aplicação."
  - descricao: Fatura por associar (sem incidência), localizável pelo código de
      prestador/convenção, na área do teste
    obtivel: tela
    razao: "Pré-condição do próprio documento (§5.2): registar previamente via ecrã
      Registo de Entrada, disponível no mesmo menu Gestão de Armazém."
  - descricao: Um prestador com exatamente 1 fatura por associar (CT-02) e outro com
      2 ou mais (CT-03)
    obtivel: tela
    razao: Controlável ao registar entradas no ecrã Registo de Entrada, conforme
      §5.2 do documento.
  - descricao: Fatura marcada com incidência (XSINDERRO='S') na área do teste
    obtivel: tela
    razao: O menu Gestão de Armazém tem 'Faturas com Incidência', ecrã indicado no
      documento para registar a incidência antes da sessão.
  - descricao: Faturas SISO com Pedido Pag (PP) associado, por associar
    obtivel: bd
    razao: "Massa real existe em GESTCONFER.TDCFFACTURAPNPSO (ex.: PP 124192);
      nenhuma tela neste fluxo cria um Pedido Pag — teria de se confirmar
      disponibilidade por SQL antes da sessão."
  - descricao: Código de pasta físico para pistolar ao completar o registo de uma
      fatura na caixa
    obtivel: nao
    razao: É um código físico associado à pasta, gerado fora desta aplicação (não há
      tela neste fluxo para o emitir); só observável dentro de uma sessão de
      caixa aberta, que esta passagem não abriu.
  - descricao: Segundo operador e segundo posto de trabalho com leitor de código de
      barras, para o tour de concorrência (CT-13)
    obtivel: nao
    razao: Depende de um segundo operador humano e hardware físico simultâneo; nada
      disto é fornecido pela aplicação.
  - descricao: Leitor de código de barras físico
    obtivel: tela
    razao: O campo 'Código da Caixa' aceita introdução manual seguida de Enter como
      alternativa à pistolagem (confirmado pelo placeholder 'Pistolar /
      introduzir…'), pelo que o leitor físico não é estritamente necessário para
      operar a tela.
